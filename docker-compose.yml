x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  environment:
    SATARK_DATABASE_URL: postgresql+psycopg://satark:satark@postgres:5432/satark
    SATARK_REDIS_URL: redis://redis:6379/0
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    SATARK_LLM_MODEL: ${SATARK_LLM_MODEL:-claude-haiku-4-5}
    SATARK_CORS_ORIGINS: http://localhost:5173
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: satark
      POSTGRES_PASSWORD: satark
      POSTGRES_DB: satark
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U satark"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  api:
    <<: *backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 30

  worker:
    <<: *backend
    command: ["satark", "worker", "--metrics-port", "9101"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["observability"]
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

volumes:
  pgdata:
