[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "satark"
version = "0.1.0"
description = "India-first KYC screening, adverse media and watchlist monitoring"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "rapidfuzz>=3.9",
    "faker>=30",
    "httpx>=0.27",
    "feedparser>=6.0",
    "anthropic>=0.40",
    "langgraph>=0.2",
    "mcp>=2.0",
    "prometheus-client>=0.20",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "locust>=2.29", "ruff>=0.6"]

[project.scripts]
satark = "satark.cli:main"

[tool.setuptools.packages.find]
include = ["satark*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
